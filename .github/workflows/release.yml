name: Publish distributions

# Production publication can be initiated manually with a GitHub release or
# automatically when pyproject.toml changes on main. Publish is gated by passing
# tests, the package version and PyPI's published-version API.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Package index used for a manual verification release
        required: true
        type: choice
        options:
          - testpypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.target || 'pypi' }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pypi_exists: ${{ steps.version.outputs.pypi_exists }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Read package version and check PyPI for duplicate publication
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib
          import urllib.error
          import urllib.request

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          url = f"https://pypi.org/pypi/text-to-music-prompt-structurer/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  response.read(1)
              exists = True
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              exists = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              outputs.write(f"version={version}\n")
              outputs.write(f"pypi_exists={str(exists).lower()}\n")
          print(f"Package version: {version}; already on PyPI: {exists}")
          PY
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - name: Run tests and lint before publication
        run: |
          python -m pip install --upgrade ".[dev]"
          python -m pytest
          ruff check .
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/text-to-music-prompt-structurer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: >-
      (github.event_name == 'release' || github.event_name == 'push')
      && needs.build.outputs.pypi_exists == 'false'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/text-to-music-prompt-structurer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub version and release
    # A release created with GITHUB_TOKEN won't re-trigger release workflows.
    if: >-
      always() && github.event_name == 'push'
      && needs.build.result == 'success'
      && (needs.publish-pypi.result == 'success'
          || (needs.publish-pypi.result == 'skipped'
              && needs.build.outputs.pypi_exists == 'true'))
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Create release only if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
